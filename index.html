<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nextSTEM Vietnam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
      <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <script>
      // Early suppression of Chrome extension "runtime.lastError" console errors
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          const msg = args[0]?.toString?.() || '';
          if (msg.includes('runtime.lastError') || msg.includes('Receiving end does not exist')) return;
          if (msg.includes('addListener') && msg.includes('undefined')) return;
          return originalError.apply(console, args);
        };
        const originalWarn = console.warn;
        console.warn = function(...args) {
          const msg = args[0]?.toString?.() || '';
          if (msg.includes('runtime.lastError') || msg.includes('Receiving end does not exist')) return;
          return originalWarn.apply(console, args);
        };
        // Global error handler for uncaught TypeErrors from extensions
        window.addEventListener('error', function(event) {
          if (event.message && event.message.includes("reading 'addListener'") && event.message.includes("undefined")) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-background-light text-slate-900 antialiased selection:bg-primary/20">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
