openapi: 3.1.0

info:
  title: nextSTEM AI Service API
  version: 1.1.0
  description: |
    Standalone AI API used by nextSTEM.

    Current live workflow:
    - `advisor_chat`

    Public endpoints:
    - `GET /health`
    - `GET /api/v1/ai/health`
    - `POST /api/v1/ai/run`
    - `POST /api/v1/ai/run/stream`

    Notes:
    - The service shares the same `AgentLoop` core as the core backend route.
    - `workflow` is used here, not `mode`.
    - `profile_context` is optional and forward-compatible.
    - `X-API-Key` is only required when the service sets `AI_API_KEY`.
    - UI clients should render URLs as clickable links, especially in `final_answer`
      and `tool_result.raw_links`.

servers:
  - url: http://localhost:8001
    description: Local AI service
  - url: https://nextstem-production.up.railway.app
    description: Railway production AI service

tags:
  - name: health
  - name: ai

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    AIRunRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: End-user message or query.
          examples:
            - Toi muon hoc cu nhan tam ly o UK
            - Xin tu van du hoc nganh CS tai Singapore
        workflow:
          type: string
          default: advisor_chat
          description: AI workflow id. Today only `advisor_chat` is supported.
          examples:
            - advisor_chat
        session_id:
          type: string
          nullable: true
          description: Caller-defined session id for short-term memory continuity.
        user_id:
          type: string
          nullable: true
          description: Optional user id for tracing and caller-side scoping.
        profile_context:
          $ref: "#/components/schemas/ProfileContext"
      additionalProperties: false

    ProfileContext:
      type: object
      description: |
        Optional structured profile context forwarded by the caller.

        Preferred normalized keys are plural:
        - `target_countries`
        - `target_fields`

        Legacy singular aliases are also accepted by runtime normalization:
        - `target_country`
        - `target_field`

        Unknown keys are allowed for forward compatibility.
      additionalProperties: true
      properties:
        grade:
          type: string
          nullable: true
        current_stage:
          type: string
          nullable: true
        school:
          type: string
          nullable: true
        subjects:
          type: string
          nullable: true
        gpa_value:
          type: number
          nullable: true
        gpa_scale:
          type: number
          nullable: true
        target_country:
          type: string
          nullable: true
          description: Legacy alias. Prefer `target_countries`.
        target_countries:
          type: array
          items:
            type: string
        target_field:
          type: string
          nullable: true
          description: Legacy alias. Prefer `target_fields`.
        target_fields:
          type: array
          items:
            type: string
        budget_amount:
          type: number
          nullable: true
        budget_currency:
          type: string
          nullable: true
        needs_scholarship:
          type: boolean
          nullable: true
        ielts:
          type: number
          nullable: true
        toefl:
          type: number
          nullable: true
        sat:
          type: integer
          nullable: true
        act:
          type: integer
          nullable: true
        intake_year:
          type: integer
          nullable: true
        intake_term:
          type: string
          nullable: true
        timeline_target:
          type: string
          nullable: true
        goals:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        notes:
          type: string
          nullable: true
      example:
        grade: "12"
        gpa_value: 8.8
        gpa_scale: 10
        target_countries:
          - Singapore
        target_fields:
          - Computer Science
        needs_scholarship: true
        ielts: 7.0
        intake_year: 2027
        intake_term: fall

    AIHealthResponse:
      type: object
      required:
        - status
        - workflows
      properties:
        status:
          type: string
          enum:
            - ok
        workflows:
          type: array
          items:
            type: string
      example:
        status: ok
        workflows:
          - advisor_chat

    QueryType:
      type: string
      enum:
        - simple
        - complex

    SubAgentPlan:
      type: object
      required:
        - agent_name
        - task
        - reason
        - priority
      properties:
        agent_name:
          type: string
        task:
          type: string
        reason:
          type: string
        priority:
          type: integer
        tools:
          type: array
          items:
            type: string
        context:
          type: object
          nullable: true
          additionalProperties: true

    OrchestratorPlan:
      type: object
      required:
        - original_query
        - interpreted_intent
        - agents
        - can_parallel
        - expected_outcome
        - query_type
      properties:
        original_query:
          type: string
        interpreted_intent:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/SubAgentPlan"
        can_parallel:
          type: boolean
        expected_outcome:
          type: string
        query_type:
          $ref: "#/components/schemas/QueryType"

    SubAgentResult:
      type: object
      required:
        - agent_name
        - success
        - result
      properties:
        agent_name:
          type: string
        success:
          type: boolean
        result:
          type: string
        execution_time:
          type: number
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: string
          nullable: true

    AgentLoopResult:
      type: object
      required:
        - success
        - query
        - final_answer
        - query_type
        - iterations
        - execution_time
        - metrics
      properties:
        success:
          type: boolean
        query:
          type: string
        final_answer:
          type: string
        query_type:
          type: string
        iterations:
          type: integer
        execution_time:
          type: number
          description: Seconds
        plan:
          allOf:
            - $ref: "#/components/schemas/OrchestratorPlan"
          nullable: true
        agent_results:
          type: array
          items:
            $ref: "#/components/schemas/SubAgentResult"
        critic_reviews:
          type: array
          items:
            type: object
            additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true

    ToolCall:
      type: object
      required:
        - agent
        - tool
        - input
      properties:
        agent:
          type: string
        tool:
          type: string
        input:
          type: object
          additionalProperties: true
        resolved_from:
          type: object
          additionalProperties:
            type: string

    HttpRequestTrace:
      type: object
      properties:
        method:
          type: string
        url:
          type: string
        from_cache:
          type: boolean

    ToolResult:
      type: object
      required:
        - agent
        - tool
        - success
      properties:
        agent:
          type: string
        tool:
          type: string
        success:
          type: boolean
        skipped:
          type: boolean
        output_preview:
          type: string
          nullable: true
        output:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        missing_fields:
          type: array
          items:
            type: string
        raw_links:
          type: array
          description: |
            Canonical source URLs collected from the tool. UI clients should render
            these as clickable references or source cards instead of plain text when possible.
          items:
            type: string
        request_trace:
          type: array
          items:
            $ref: "#/components/schemas/HttpRequestTrace"

    TraceBundle:
      type: object
      required:
        - workflow
        - tool_calls
        - tool_results
      properties:
        workflow:
          type: string
        session_id:
          type: string
          nullable: true
        user_id:
          type: string
          nullable: true
        profile_context:
          $ref: "#/components/schemas/ProfileContext"
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        tool_results:
          type: array
          items:
            $ref: "#/components/schemas/ToolResult"

    AgentLoopResultWithTrace:
      allOf:
        - $ref: "#/components/schemas/AgentLoopResult"
        - type: object
          required:
            - trace
          properties:
            trace:
              $ref: "#/components/schemas/TraceBundle"

    UIFriendlyRenderingNote:
      type: object
      description: |
        Rendering guidance for frontend clients:
        - Any `http://` or `https://` URL appearing in `final_answer` should be linkified.
        - `tool_result.raw_links` should be shown as clickable links or source cards.
        - If a response includes a "Nguon tham khao" section, each item should be clickable.
        - Unknown events may be ignored, but link rendering should still apply to visible text.

    SSEStartData:
      type: object
      required:
        - query
        - mode
      properties:
        query:
          type: string
        mode:
          type: string

    SSEQueryClassifiedData:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/QueryType"

    SSEPlanningData:
      type: object
      required:
        - message
        - iteration
      properties:
        message:
          type: string
        iteration:
          type: integer

    SSEPlanCreatedData:
      type: object
      required:
        - plan
        - mode
        - agents
      properties:
        plan:
          $ref: "#/components/schemas/OrchestratorPlan"
        mode:
          type: string
        agents:
          type: array
          items:
            type: string

    SSEClarificationRequiredData:
      type: object
      required:
        - missing_fields
        - blocked_tools
        - questions
        - resolved_from
        - can_continue
        - continue_message
      properties:
        missing_fields:
          type: array
          items:
            type: string
        blocked_tools:
          type: array
          items:
            type: string
        questions:
          type: array
          items:
            type: string
        resolved_from:
          type: object
          additionalProperties:
            type: string
        can_continue:
          type: boolean
        continue_message:
          type: string

    SSETextDeltaData:
      type: object
      required:
        - delta
      properties:
        delta:
          type: string

    SSECompletedData:
      type: object
      required:
        - metrics
      properties:
        metrics:
          type: object
          additionalProperties: true

    SSEErrorData:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    SSEDoneData:
      type: object
      additionalProperties: false

paths:
  /health:
    get:
      tags:
        - health
      summary: Root service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok

  /api/v1/ai/health:
    get:
      tags:
        - ai
      summary: AI workflow health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIHealthResponse"

  /api/v1/ai/run:
    post:
      tags:
        - ai
      summary: Run AI workflow and return JSON
      description: |
        Non-streaming execution.

        Auth note:
        - If `AI_API_KEY` is empty on the service, `X-API-Key` is optional.
        - If `AI_API_KEY` is set, callers must send the matching `X-API-Key`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRunRequest"
            examples:
              advisorChat:
                value:
                  message: Xin tu van du hoc nganh CS tai Singapore
                  workflow: advisor_chat
                  session_id: sess-001
                  user_id: user-123
                  profile_context:
                    grade: "12"
                    gpa_value: 8.8
                    gpa_scale: 10
                    target_countries:
                      - Singapore
                    target_fields:
                      - Computer Science
                    needs_scholarship: true
                    ielts: 7.0
      responses:
        "200":
          description: Agent execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentLoopResult"
        "401":
          description: Invalid API key

  /api/v1/ai/run/stream:
    post:
      tags:
        - ai
      summary: Run AI workflow and stream SSE events
      description: |
        Streaming execution using `text/event-stream`.

        Typical event sequence:
        - `start`
        - `query_classified`
        - `planning`
        - `plan_created`
        - `clarification_required` (optional)
        - `executing`
        - `agent_start`
        - `agent_stage`
        - `tool_call`
        - `tool_result`
        - `text_delta`
        - `completed`
        - `final_result`
        - `done`

        Clients should:
        - append answer text from `text_delta`
        - treat `final_result` as the authoritative final payload
        - stop reading on `done`
        - ignore unknown events for forward compatibility
        - render any URLs found in streamed text or `raw_links` as clickable UI links
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIRunRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                clarificationFlow:
                  summary: Clarification required
                  value: |
                    event: start
                    data: {"query":"Tim hoc bong CS tai Singapore","mode":"general"}

                    event: query_classified
                    data: {"type":"complex"}

                    event: clarification_required
                    data: {"missing_fields":["gpa_value"],"blocked_tools":["scholarship_finder"],"questions":["GPA hoac diem trung binh hien tai cua ban la bao nhieu? (thang 10 hoac 4)"],"resolved_from":{"target_countries":"current_turn","target_fields":"current_turn"},"can_continue":true,"continue_message":"tiep tuc"}

                    event: done
                    data: {}

                fullRun:
                  summary: Full streamed run
                  value: |
                    event: start
                    data: {"query":"Toi muon hoc cu nhan tam ly o UK","mode":"general"}

                    event: tool_call
                    data: {"agent":"advisor","tool":"university_explorer","input":{"query":"Toi muon hoc cu nhan tam ly o UK","country":"UK","field":"Psychology","gpa":null},"resolved_from":{"target_countries":"current_turn","target_fields":"current_turn"}}

                    event: tool_result
                    data: {"agent":"advisor","tool":"university_explorer","success":true,"raw_links":["https://www.ucl.ac.uk/prospective-students/undergraduate/degrees/psychology-bsc","https://www.kcl.ac.uk/study/undergraduate/courses/psychology-bsc"],"output_preview":"Tim thay 3 truong phu hop: ..."}

                    event: text_delta
                    data: {"delta":"Chao ban, nextSTEM rat vui duoc ho tro ban..."}

                    event: final_result
                    data: {"success":true,"query":"Toi muon hoc cu nhan tam ly o UK","final_answer":"...","query_type":"complex","iterations":1,"execution_time":12.34,"plan":null,"agent_results":[],"critic_reviews":[],"metrics":{"latency_ms":12340.0},"error":null,"trace":{"workflow":"advisor_chat","session_id":"sess-001","user_id":"user-123","profile_context":{"target_countries":["UK"],"target_fields":["Psychology"]},"tool_calls":[],"tool_results":[]}}

                    event: done
                    data: {}
        "401":
          description: Invalid API key
